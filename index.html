<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Đặc Biệt</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .quiz-card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .question {
            font-size: 1.4rem;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 25px;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .option-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        /* Hiệu ứng đổi màu khi dí chuột vào chữ Nhi */
        .option-btn:hover {
            background: #ffe3e3;
            border-color: #ff8787;
            color: #e03131;
            font-weight: bold;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="question">Kiệt thích gì?</div>
    
    <div class="options-container">
        <!-- Mỗi nút lưu đáp án gốc trong thuộc tính data-original -->
        <button class="option-btn" data-original="A. Mèo" onmouseenter="trollIn(this)" onmouseleave="trollOut(this)">A. Mèo</button>
        <button class="option-btn" data-original="B. Chó" onmouseenter="trollIn(this)" onmouseleave="trollOut(this)">B. Chó</button>
        <button class="option-btn" data-original="C. Ngủ" onmouseenter="trollIn(this)" onmouseleave="trollOut(this)">C. Ngủ</button>
        <button class="option-btn" data-original="D. Học" onmouseenter="trollIn(this)" onmouseleave="trollOut(this)">D. Học</button>
    </div>
</div>

<script>
    // Khi dí chuột (con trỏ) vào đáp án
    function trollIn(element) {
        element.innerText = "Nhi";
    }

    // Khi di chuột ra ngoài (nếu bạn muốn chữ quay trở lại đáp án cũ để họ bất ngờ tiếp)
    function trollOut(element) {
        // Lấy lại đáp án gốc đã lưu sẵn ở thuộc tính data-original
        element.innerText = element.getAttribute('data-original');
    }
</script>

</body>
</html>
